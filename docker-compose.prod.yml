services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-weather_consensus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published to the host - only reachable from other containers
    # on this compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off migration runner: applies pending Prisma migrations, then exits.
  # Uses the `builder` stage since it still has the Prisma CLI (the `runner`
  # image is trimmed down to runtime-only files).
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_consensus}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_consensus}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # Required by Auth.js v5 when self-hosting (not on Vercel) so it trusts
      # the Host header from the reverse proxy/VPS instead of rejecting it.
      AUTH_TRUST_HOST: "true"
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      ACCUWEATHER_API_KEY: ${ACCUWEATHER_API_KEY:-}
      WEATHERAPI_API_KEY: ${WEATHERAPI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SITE_URL: ${SITE_URL:-}
    ports:
      # Defaults to publishing on every interface, port 3000 - override
      # APP_BIND (e.g. "127.0.0.1:3010") in .env when this host already runs
      # other services and the app should stay behind a reverse proxy.
      - "${APP_BIND:-0.0.0.0:3000}:3000"

volumes:
  postgres_data:
  redis_data:
